# fly.toml app configuration file generated for konew on 2026-06-05T02:50:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'konew'
primary_region = 'gru'
kill_signal = 'SIGTERM'

[build]

[deploy]

[mounts]
  source = 'sqlite_data'
  destination = '/app/data'

[env]
  PHX_HOST = 'konew.fly.dev'
  PORT = '8080'
  PHX_SERVER = 'true'
  DB_ADAPTER = 'sqlite3'
  DATABASE_PATH = '/app/data/konew_prod.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
